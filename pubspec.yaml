name: daymark
description: >-
  Daymark is a private, offline work ledger. Plan with weight, break work
  into steps, time it honestly, keep markdown notes, and move snapshots
  between your own devices over the LAN.
publish_to: 'none'
repository: https://github.com/BadarSaghir/daymark-work-ledger
issue_tracker: https://github.com/BadarSaghir/daymark-work-ledger/issues
version: 1.3.0+4

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  sqflite: ^2.4.5
  sqflite_common_ffi: ^2.4.5
  path: ^1.9.1
  sqflite_common: ^2.5.14
  path_provider: ^2.1.6
  intl: ^0.20.3
  uuid: ^4.5.2
  crypto: ^3.0.6
  archive: ^4.0.0
  file_selector: ^1.1.0
  share_plus: ^13.3.1
  http: ^1.6.0
  url_launcher: ^6.3.3
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2
  permission_handler: ^13.0.2
  flutter_markdown_plus: ^1.0.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/config/
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
    - family: Newsreader
      fonts:
        - asset: assets/fonts/Newsreader.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/branding/icon.png"
  min_sdk_android: 23
  remove_alpha_ios: true
  adaptive_icon_background: "#1D5B4F"
  adaptive_icon_foreground: "assets/branding/icon.png"
  adaptive_icon_monochrome: "assets/branding/notification_icon.png"
  adaptive_icon_foreground_inset: 0
  macos:
    generate: true
    image_path: "assets/branding/icon.png"
  windows:
    generate: true
    image_path: "assets/branding/icon.png"
    icon_size: 256
